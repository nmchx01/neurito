[project]
name = "neurito"
version = "0.1.0"
description = "Juego educativo para explorar una pequeña red neuronal con Neurito"
readme = "README.md"
authors = [
    { name = "Nicolas Monroy" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
]

[project.scripts]
neurito = "neurito:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
